name: SonarQube Scan

on:
  pull_request:
    branches:
      - main
      - "feat-*"
      - "release/**"
  push:
    branches:
      - main
      - "feat-*"

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_PROJECT_KEY: SonarCloud-Demos_onyx
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Disable automatic analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --request POST \
            "${SONAR_HOST_URL}/api/autoscan/activation?projectKey=${SONAR_PROJECT_KEY}&enable=false"

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Wait for SonarQube processing
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          task_file=".scannerwork/report-task.txt"
          if [ ! -f "${task_file}" ]; then
            echo "${task_file} was not created by the scanner."
            exit 1
          fi

          ce_task_id="$(grep '^ceTaskId=' "${task_file}" | cut -d= -f2)"
          if [ -z "${ce_task_id}" ]; then
            echo "ceTaskId missing from ${task_file}."
            exit 1
          fi

          for _ in $(seq 1 120); do
            response="$(curl --fail --silent --show-error \
              --user "${SONAR_TOKEN}:" \
              "${SONAR_HOST_URL}/api/ce/task?id=${ce_task_id}")"
            status="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["task"]["status"])' <<< "${response}")"
            echo "SonarQube task ${ce_task_id}: ${status}"
            case "${status}" in
              SUCCESS)
                exit 0
                ;;
              FAILED|CANCELED)
                python3 -c 'import json, sys; print(json.load(sys.stdin)["task"].get("errorMessage", "SonarQube task failed"))' <<< "${response}"
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for SonarQube task ${ce_task_id}."
          exit 1

      - name: Re-enable automatic analysis
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --request POST \
            "${SONAR_HOST_URL}/api/autoscan/activation?projectKey=${SONAR_PROJECT_KEY}&enable=true"
